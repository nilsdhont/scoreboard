<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scoreboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body {
      padding: 0;
      margin: 0;
      background: white;
    }

    .scoreboard {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      width: 192px;
      height: 64px;
      color: lawngreen;
      background-color: black;
      font-family: "Lucida Console", monospace;
    }

    .teamName {
      height: 25%;
      width: 50%;
      text-align: center;
      font-size: 15px;
    }

    .stand {
      height: 75%;
      text-align: center;
      align-content: center;
      font-size: 58px;
    }

    /* smaller digits once a score hits 100 */
    .scoreboard.bigScore .stand {
      font-size: 46px;
    }

    .score {
      width: 42%;
    }

    .separator {
      width: 16%;
    }
  </style>
</head>
<body>
<div class="scoreboard" id="scoreboard">
  <div class="teamName" id="nameBrigandZe">BrigandZe</div>
  <div class="teamName" id="nameVisitors">Visitors</div>
  <div class="score stand" id="scoreBrigandZe">0</div>
  <div class="stand separator">-</div>
  <div class="score stand" id="scoreVisitors">0</div>
</div>
<img id="fireworks" width="192" height="64" alt="" style="display: none">
<button onclick="showFireworks()" style="margin-top: 20px">Try!</button>
<script>
  let fireworksTimer;

  // swap the board for the gif for 30s; a new click restarts both
  function showFireworks() {
    const board = document.getElementById('scoreboard');
    const img = document.getElementById('fireworks');
    img.src = 'brigandze_try_fireworks_192x64.gif?' + Date.now(); // restart the animation
    img.style.display = 'block';
    board.style.display = 'none';
    clearTimeout(fireworksTimer);
    fireworksTimer = setTimeout(() => {
      img.style.display = 'none';
      board.style.display = '';
    }, 30000);
  }

  async function updateScoreBoard() {
    try {
      const response = await fetch('/matchData');
      if (!response.ok) {
        return;
      }
      const text = await response.text();
      if (!text) {
        return; // 204: no current match, keep what is shown
      }
      const match = JSON.parse(text);
      document.getElementById('nameBrigandZe').textContent = match.nameBrigandZe;
      document.getElementById('nameVisitors').textContent = match.nameVisitors.substring(0, 11);
      document.getElementById('scoreBrigandZe').textContent = match.scoreBrigandZe;
      document.getElementById('scoreVisitors').textContent = match.scoreVisitors;
      document.getElementById('scoreboard').classList.toggle('bigScore',
          match.scoreBrigandZe >= 100 || match.scoreVisitors >= 100);
    } catch (e) {
      console.log(e);
    }
  }

  updateScoreBoard();
  setInterval(updateScoreBoard, 5000);
</script>
</body>
</html>
