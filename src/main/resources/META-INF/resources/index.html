<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scoreboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" href="fonts/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ShareTechMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* bundled fonts so every device renders the board the same, with a plain zero */
    @font-face {
      font-family: "Scoreboard Digits";
      src: url("fonts/DSEG7Classic-Bold.woff2") format("woff2");
      font-display: block;
    }

    @font-face {
      font-family: "Scoreboard Text";
      src: url("fonts/ShareTechMono-Regular.woff2") format("woff2");
      font-display: block;
    }

    html, body {
      padding: 0;
      margin: 0;
      background: white;
    }

    .scoreboard {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      width: 192px;
      height: 64px;
      color: lawngreen;
      background-color: black;
      font-family: "Scoreboard Text", "Lucida Console", monospace;
    }

    .teamName {
      height: 25%;
      width: 50%;
      text-align: center;
      font-size: 15px;
    }

    /* flex centering keeps a glyph centered even when it is wider than its cell */
    .stand {
      height: 75%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Scoreboard Digits", "Lucida Console", monospace;
      font-size: 44px;
    }

    /* smaller digits once a score hits 100 */
    .scoreboard.bigScore .stand {
      font-size: 32px;
    }

    .score {
      width: 42%;
    }

    .separator {
      width: 16%;
    }

    /* controls below the board, sized for thumbs on a phone */
    .panel {
      max-width: 480px;
      padding: 12px;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .panel button {
      border: 1px solid #999;
      border-radius: 8px;
      background: #f2f2f2;
      touch-action: manipulation;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .switch input {
      appearance: none;
      width: 48px;
      height: 28px;
      margin: 0;
      border-radius: 14px;
      background: #ccc;
      position: relative;
    }

    .switch input::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      transition: left .15s;
    }

    .switch input:checked {
      background: #2e7d32;
    }

    .switch input:checked::before {
      left: 23px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0;
      padding: 0;
      border: 0;
      min-width: 0;
    }

    .controls:disabled {
      opacity: .35;
    }

    .team, .gifs {
      display: grid;
      gap: 8px;
    }

    .panel h2 {
      margin: 0;
      font-size: 1rem;
      text-align: center;
    }

    .team button, .gifs button {
      padding: 14px 0;
      font-size: 1.75rem;
    }

    .gifGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .gifGrid button {
      font-size: 1.25rem;
    }

    .gifGrid .upload {
      grid-column: span 2;
    }

    .panel hr {
      margin: 16px 0;
      border: 0;
      border-top: 1px solid #ccc;
    }

    .minus {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .minus button {
      padding: 10px 0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
<div class="scoreboard" id="scoreboard">
  <div class="teamName" id="nameBrigandZe">BrigandZe</div>
  <div class="teamName" id="nameVisitors">Visitors</div>
  <div class="score stand" id="scoreBrigandZe">0</div>
  <div class="stand separator">-</div>
  <div class="score stand" id="scoreVisitors">0</div>
</div>
<img id="gif" width="192" height="64" alt="" style="display: none">
<div class="panel">
  <label class="switch"><input type="checkbox" id="manual"> Manual mode</label>
  <fieldset class="controls" id="controls" disabled>
    <div class="team">
      <h2>Home</h2>
      <button onclick="post('/matchData/score?home=5&visitors=0')">+5</button>
      <button onclick="post('/matchData/score?home=3&visitors=0')">+3</button>
      <button onclick="post('/matchData/score?home=2&visitors=0')">+2</button>
      <div class="minus">
        <button onclick="post('/matchData/score?home=-5&visitors=0')">-5</button>
        <button onclick="post('/matchData/score?home=-3&visitors=0')">-3</button>
        <button onclick="post('/matchData/score?home=-2&visitors=0')">-2</button>
      </div>
    </div>
    <div class="team">
      <h2>Visitors</h2>
      <button onclick="post('/matchData/score?home=0&visitors=5')">+5</button>
      <button onclick="post('/matchData/score?home=0&visitors=3')">+3</button>
      <button onclick="post('/matchData/score?home=0&visitors=2')">+2</button>
      <div class="minus">
        <button onclick="post('/matchData/score?home=0&visitors=-5')">-5</button>
        <button onclick="post('/matchData/score?home=0&visitors=-3')">-3</button>
        <button onclick="post('/matchData/score?home=0&visitors=-2')">-2</button>
      </div>
    </div>
  </fieldset>
  <hr>
  <div class="gifs">
    <h2>Gifs</h2>
    <div class="gifGrid">
      <button onclick="post('/matchData/gif?name=try')">Try!</button>
      <button onclick="post('/matchData/gif?name=conversion')">Conversion</button>
      <button onclick="post('/matchData/gif?name=penalty')">Penalty</button>
      <button onclick="post('/matchData/gif?name=basics')">De Basics</button>
      <button class="upload" onclick="upload.click()">Test a gif…</button>
    </div>
    <input type="file" id="upload" accept="image/gif" hidden>
  </div>
</div>
<script>
  const board = document.getElementById('scoreboard');
  const img = document.getElementById('gif');
  const manual = document.getElementById('manual');
  const controls = document.getElementById('controls');
  let seq = 0;
  let shownGif = null;

  // every client polls, the phone also POSTs; only the newest request may render so a slow poll can't undo a tap
  async function load(url, method, body) {
    const mine = ++seq;
    try {
      const headers = body ? {'Content-Type': 'image/gif'} : undefined;
      const response = await fetch(url, {method, body, headers});
      if (!response.ok && body) {
        alert('Upload failed: ' + response.status);
      }
      if (response.ok && mine === seq) {
        render(await response.json());
      }
    } catch (e) {
      console.log(e);
    }
  }

  const post = url => load(url, 'POST');

  function render(state) {
    document.getElementById('nameBrigandZe').textContent = state.nameBrigandZe;
    document.getElementById('nameVisitors').textContent = state.nameVisitors.substring(0, 11);
    document.getElementById('scoreBrigandZe').textContent = state.scoreBrigandZe;
    document.getElementById('scoreVisitors').textContent = state.scoreVisitors;
    board.classList.toggle('bigScore', state.scoreBrigandZe >= 100 || state.scoreVisitors >= 100);
    manual.checked = state.manual;
    controls.disabled = !state.manual;
    if (state.gif && state.gif !== shownGif) {
      img.src = state.gif + '?' + Date.now(); // restart the animation
    }
    shownGif = state.gif;
    img.style.display = state.gif ? 'block' : 'none';
    board.style.display = state.gif ? 'none' : '';
  }

  const upload = document.getElementById('upload');
  upload.onchange = () => {
    if (upload.files.length) {
      load('/matchData/gif/upload', 'POST', upload.files[0]);
    }
    upload.value = ''; // picking the same file again should upload again
  };

  manual.onchange = () => post('/matchData/manual?on=' + manual.checked);
  load('/matchData');
  setInterval(() => load('/matchData'), 2000);
</script>
</body>
</html>
